[workspace]
members = [
    "touchline",

    # seeder
    "crates/seeder",
    
    # ui
    "crates/ui",

    # simulation crates
    "crates/simulation/league_match",
    "crates/simulation/league",
    "crates/simulation/transfer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "custom"
authors = [
    "Syed Vilayat Ali Rizvi <syedvilayatalirizvi@proton.me>"
]

[workspace.dependencies]
egui = { version = "0.37.0", features = ["rayon"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.0", features = ["full"] }
thiserror = "2.0.21"
duckdb = { version = "1.10506.1", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json"] }
async-trait = "0.1.92"

